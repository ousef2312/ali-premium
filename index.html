<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="صالون علي - سموحة، الإسكندرية" />
  <title>صالون علي | Saloon Ali</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />

  <!-- FontAwesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ═══ Custom Cursor Glow ═══ -->
  <div class="cursor-glow" id="cursorGlow"></div>

  <!-- ═══ Gold Dust Particle Canvas ═══ -->
  <canvas id="particleCanvas"></canvas>

  <!-- ═══ Background Atmospheric Orbs ═══ -->
  <div class="bg-orbs" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <!-- ═══ Main Content ═══ -->
  <main class="main-wrapper">

    <!-- ── Hero Header ── -->
    <header class="hero" id="hero">

      <div class="logo-container" id="logoContainer">
        <div class="logo-ring-outer"></div>
        <div class="logo-ring-mid"></div>
        <div class="logo-ring-inner"></div>
        <img src="logo.png" alt="صالون علي" class="logo-img" id="logoImg" />
      </div>

      <h1 class="title-arabic" id="titleAr">صالون علي</h1>
      <p class="title-latin"   id="titleLat">SALOON ALI</p>
      <p class="subtitle"      id="subtitle">سموحة &nbsp;·&nbsp; بجوار جرين بلازا</p>

      <div class="hero-divider" id="heroDivider">
        <span class="divider-line"></span>
        <span class="divider-diamond"></span>
        <span class="divider-line"></span>
      </div>
    </header>

    <!-- ── Link Cards ── -->
    <section class="cards-section" aria-label="روابط التواصل">

      <!-- Facebook -->
      <a href="https://www.facebook.com/share/1FaHMtFLDp/?mibextid=wwXIfr"
         target="_blank" rel="noopener noreferrer"
         class="link-card card--facebook"
         data-tilt data-tilt-max="10" data-tilt-speed="500"
         data-tilt-glare="true" data-tilt-max-glare="0.12">
        <div class="card-icon-wrap">
          <i class="fa-brands fa-facebook-f card-icon" aria-hidden="true"></i>
        </div>
        <div class="card-text">
          <span class="card-label">فيسبوك</span>
          <span class="card-sublabel">Facebook · تابعنا</span>
        </div>
        <i class="fa-solid fa-chevron-left card-arrow" aria-hidden="true"></i>
        <div class="card-shimmer"></div>
        <div class="card-glow"></div>
      </a>

      <!-- TikTok -->
      <a href="https://www.tiktok.com/@alireda6198"
         target="_blank" rel="noopener noreferrer"
         class="link-card card--tiktok"
         data-tilt data-tilt-max="10" data-tilt-speed="500"
         data-tilt-glare="true" data-tilt-max-glare="0.12">
        <div class="card-icon-wrap">
          <i class="fa-brands fa-tiktok card-icon" aria-hidden="true"></i>
        </div>
        <div class="card-text">
          <span class="card-label">تيك توك</span>
          <span class="card-sublabel">TikTok · @alireda6198</span>
        </div>
        <i class="fa-solid fa-chevron-left card-arrow" aria-hidden="true"></i>
        <div class="card-shimmer"></div>
        <div class="card-glow"></div>
      </a>

      <!-- InstaPay -->
      <a href="https://ipn.eg/S/ali_reda932/instapay/5hhSpR"
         target="_blank" rel="noopener noreferrer"
         class="link-card card--instapay"
         data-tilt data-tilt-max="10" data-tilt-speed="500"
         data-tilt-glare="true" data-tilt-max-glare="0.12">
        <div class="card-icon-wrap">
          <i class="fa-solid fa-money-bill-wave card-icon" aria-hidden="true"></i>
        </div>
        <div class="card-text">
          <span class="card-label">انستاباي</span>
          <span class="card-sublabel">InstaPay · ali_reda932</span>
        </div>
        <i class="fa-solid fa-chevron-left card-arrow" aria-hidden="true"></i>
        <div class="card-shimmer"></div>
        <div class="card-glow"></div>
      </a>

      <!-- Google Maps -->
      <a href="https://www.google.com/maps/place/Saloon+Ali/@31.2091104,29.9623474,47m/data=!3m1!1e3!4m8!3m7!1s0x14f5c4b0829edec7:0xa8e3d2c170d60df0!8m2!3d31.2091104!4d29.9625083!9m1!1b1!16s%2Fg%2F11hbl7bf7d"
         target="_blank" rel="noopener noreferrer"
         class="link-card card--maps"
         data-tilt data-tilt-max="10" data-tilt-speed="500"
         data-tilt-glare="true" data-tilt-max-glare="0.12">
        <div class="card-icon-wrap">
          <i class="fa-solid fa-location-dot card-icon" aria-hidden="true"></i>
        </div>
        <div class="card-text">
          <span class="card-label">الموقع</span>
          <span class="card-sublabel">Google Maps · اعثر علينا</span>
        </div>
        <i class="fa-solid fa-chevron-left card-arrow" aria-hidden="true"></i>
        <div class="card-shimmer"></div>
        <div class="card-glow"></div>
      </a>

      <!-- Google Review -->
      <a href="https://search.google.com/local/writereview?placeid=ChIJq6raf7rE9RQRUnT-IjjDI8I"
         target="_blank" rel="noopener noreferrer"
         class="link-card card--review"
         data-tilt data-tilt-max="10" data-tilt-speed="500"
         data-tilt-glare="true" data-tilt-max-glare="0.12">
        <div class="card-icon-wrap">
          <i class="fa-solid fa-star card-icon" aria-hidden="true"></i>
        </div>
        <div class="card-text">
          <span class="card-label">قيّمنا</span>
          <span class="card-sublabel">Google Review · شاركنا رأيك</span>
        </div>
        <i class="fa-solid fa-chevron-left card-arrow" aria-hidden="true"></i>
        <div class="card-shimmer"></div>
        <div class="card-glow"></div>
      </a>

    </section>

    <!-- ── Footer ── -->
    <footer class="footer">
      <div class="footer-line"></div>
      <p class="footer-text">صالون علي &copy; 2025 &nbsp;·&nbsp; الإسكندرية</p>
    </footer>

  </main>

  <!-- ═══ Scripts ═══ -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.1/vanilla-tilt.min.js"></script>
  <script src="script.js"></script>

</body>
</html>
